# Hugo configuration file
baseURL: https://felipeferreira.io/
languageCode: pt-br
defaultContentLanguage: pt
title: Felipe Ferreira
enableEmoji: true

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Artigos
      pageRef: /articles
      weight: 1
    - name: Buscar
      weight: 2
      params:
        type: search
    - name: GitHub
      weight: 3
      url: "https://github.com/felipesilfer"
      params:
        icon: github

params:
  # Página inicial em "modo perfil", como no site antigo (layouts/profile.html)
  profile:
    title: Olá, eu sou o Felipe 👋
    description: |
      Trabalho no [SERPRO](https://www.serpro.gov.br/)
    image: /images/profile.png
    imageTitle: Foto de Felipe Ferreira
    buttons:
      - name: Não clique! 😝
        url: https://www.youtube.com/watch?v=dQw4w9WgXcQ
    social:
      - name: buymeacoffee
        title: Ko-fi
        url: https://ko-fi.com/felipesilfer
      - name: github
        title: GitHub
        url: https://github.com/felipesilfer
      - name: twitter
        title: Twitter
        url: https://twitter.com/felipesilfer
      - name: linkedin
        title: LinkedIn
        url: https://www.linkedin.com/in/felipesilfer/

  navbar:
    displayTitle: true
    displayLogo: false

  theme:
    default: system
    displayToggle: true

  footer:
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: false
