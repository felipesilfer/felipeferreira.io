# Hugo configuration file
baseURL: https://felipeferreira.io/
languageCode: pt-br
defaultContentLanguage: pt
title: Felipe Ferreira
enableEmoji: true

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

menu:
  main:
    - name: Artigos
      pageRef: /articles
      weight: 1
    - name: Currículo
      pageRef: /curriculo
      weight: 2
    - name: Buscar
      weight: 3
      params:
        type: search

params:
  # Página inicial em "modo perfil", como no site antigo (layouts/profile.html)
  profile:
    title: Olá, eu sou o Felipe 👋
    description: |
      👨🏻‍💻Trabalho no [SERPRO](https://www.serpro.gov.br/), 👓Geek, 🎮Gamer, com interesse em 🐍Python, ⚙️DevOps, 📊Engenharia de Dados e 🤖IA.
    image: /images/profile.jpg
    imageTitle: Foto de Felipe Ferreira
    # Quantos artigos recentes mostrar abaixo do perfil (0 esconde a seção)
    recentPosts: 3
    buttons:
      - name: 🎵 Não clique! 🎧😝
        title: 🎶Uma música aleatória...🎧
        # Cada clique sorteia um destino desta lista
        urls:
          - https://www.youtube.com/watch?v=dQw4w9WgXcQ
          - https://www.youtube.com/watch?v=ucRulNQsuYQ
          - https://www.youtube.com/watch?v=EH9meoWmAOM
          - https://www.youtube.com/watch?v=LvetJ9U_tVY
          - https://www.youtube.com/watch?v=Tk9TM7-eTmw
          - https://www.youtube.com/watch?v=DnGdoEa1tPg
          - https://www.youtube.com/watch?v=t365MuktYQs
          - https://www.youtube.com/watch?v=mKehX9pnxEk
          - https://www.youtube.com/watch?v=Oextk-If8HQ
          - https://www.youtube.com/watch?v=U6eFQDaJmnk
          - https://www.youtube.com/watch?v=xpVfcZ0ZcFM
          - https://www.youtube.com/watch?v=Pib8eYDSFEI
          - https://www.youtube.com/watch?v=h0ffIJ7ZO4U
          - https://www.youtube.com/watch?v=1o84y-5-cO0
