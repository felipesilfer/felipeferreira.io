# Hugo configuration file
baseURL: https://felipeferreira.io/
defaultContentLanguage: pt
# Português fica na raiz (/), inglês em /en/
defaultContentLanguageInSubdir: false
title: Felipe Ferreira
enableEmoji: true

# import hextra as module
module:
  imports:
    - path: github.com/imfing/hextra

markup:
  # allow raw html
  goldmark:
    renderer:
      unsafe: true

  # enable hextra syntax highlight
  highlight:
    noClasses: false

# Idiomas do site. O conteúdo em inglês fica em arquivos .en.md ao lado dos
# originais; textos dos templates ficam em i18n/pt.yaml e i18n/en.yaml.
languages:
  pt:
    languageName: Português
    languageCode: pt-br
    weight: 1
    menu:
      main:
        - name: Blog
          pageRef: /blog
          weight: 1
        - name: Currículo
          pageRef: /curriculo
          weight: 2
        - name: Buscar
          weight: 3
          params:
            type: search
        - name: Idioma
          weight: 4
          params:
            type: language-toggle
            # O ícone só serve para o menu do celular (sidebar do Hextra) ignorar o item
            icon: translate
        - name: Tema
          weight: 5
          params:
            type: theme-button
            icon: sun
  en:
    languageName: English
    languageCode: en-us
    weight: 2
    menu:
      main:
        - name: Blog
          pageRef: /blog
          weight: 1
        - name: Resume
          # O navbar do Hextra usa o pageRef como URL, então vai o slug em inglês
          pageRef: /resume
          weight: 2
        - name: Search
          weight: 3
          params:
            type: search
        - name: Language
          weight: 4
          params:
            type: language-toggle
            # O ícone só serve para o menu do celular (sidebar do Hextra) ignorar o item
            icon: translate
        - name: Theme
          weight: 5
          params:
            type: theme-button
            icon: sun
    # Só o que muda em inglês; o resto vem de params abaixo
    params:
      profile:
        title: Hi, I'm Felipe 👋
        description: |
          👨🏻‍💻Working at [SERPRO](https://www.serpro.gov.br/), 👓Geek, 🎮Gamer, interested in 🐍Python, ⚙️DevOps, 📊Data Engineering and 🤖AI.
        imageTitle: Photo of Felipe Ferreira
      comments:
        disqus:
          lang: en

params:
  # Imagem de prévia (Open Graph) para links compartilhados em WhatsApp, Discord etc.
  # Vale para páginas sem "images" no front matter. Ideal: 1200×630.
  images:
    - /images/og-default.jpg

  # Página inicial em "modo perfil", como no site antigo (layouts/profile.html)
  profile:
    title: Olá, eu sou o Felipe 👋
    description: |
      👨🏻‍💻Trabalho no [SERPRO](https://www.serpro.gov.br/), 👓Geek, 🎮Gamer, com interesse em 🐍Python, ⚙️DevOps, 📊Engenharia de Dados e 🤖IA.
    image: /images/profile.jpg
    imageTitle: Foto de Felipe Ferreira
    # Quantos artigos recentes mostrar abaixo do perfil (0 esconde a seção)
    recentPosts: 3
    buttons:
      # Texto do botão e da dica: chaves notClickButton/notClickTitle em i18n/
      - i18n: notClick
        # Cada clique sorteia um destino desta lista
