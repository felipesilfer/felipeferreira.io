    social:
      - name: buymeacoffee
        title: Ko-fi
        url: https://ko-fi.com/felipesilfer
      - name: github
        title: GitHub
        url: https://github.com/felipesilfer
      - name: instagram
        title: Instagram
        url: https://instagram.com/felipesilfer/
      - name: twitter
        title: Twitter
        url: https://twitter.com/felipesilfer
      - name: linkedin
        title: LinkedIn
        url: https://www.linkedin.com/in/felipesilfer/

  # Barra "Arquivo" à esquerda nos artigos (layouts/_partials/article-archive.html)
  articleArchive:
    # Quantos artigos mostrar, dos mais recentes (0 = todos)
    limit: 10

  # Mostra as tags da página embaixo do sumário ("Nesta página")
  toc:
    displayTags: true

  navbar:
    displayTitle: true
    displayLogo: false

  theme:
    default: system
    # O seletor do Hextra (rodapé e menu do celular) fica desligado: o tema
    # muda pelo botão Sol/Lua no menu de cima (layouts/_partials/theme-button.html)
    displayToggle: false

  footer:
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: false

  # Comentários nos artigos via Disqus (layouts/_partials/components/disqus.html)
  comments:
    enable: true
    type: disqus
    disqus:
      shortname: felipeferreira   # shortname do site no Disqus
      lang: pt_BR
